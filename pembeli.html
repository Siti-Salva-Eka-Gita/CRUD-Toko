<body>
<h1>Beli apa?</h1>

</form>

<table>

      <th>Kode Produk</th>
      <th>Nama Produk</th>
      <th>Harga</th>
      <th>Stok</th>
    </tr>
  </thead>
  <tbody id="dataPembeli"></tbody>
</table>

<p id="Beli"></p>

  <script src="buyer.js"></script>
